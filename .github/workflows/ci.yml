# Roda em todo push e pull request: garante que nada quebrado chegue na main.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos (app e Worker)
        run: npx tsc -b && npx tsc -p worker/tsconfig.json
      - name: Dados de regra válidos
        run: npm run build-data && git diff --exit-code data/
      - name: Testes unitários
        run: npm test
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
